<mat-toolbar id="header" color="primary">
    <h1>Bake & Cake - Item Requests</h1>
    <a routerLink="">
        <button mat-icon-button class=" home-icon" aria-label="icon-button with home icon">
            <mat-icon>home</mat-icon>
        </button>
    </a>
  </mat-toolbar>
  <div id="request-section">
    <table mat-table [dataSource]="itemRequests" class="mat-elevation-z8">
  
        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->
      
        <!-- Date of Delivery Column -->
        <ng-container matColumnDef="dateOfDelivery">
          <th mat-header-cell *matHeaderCellDef>Date of Delivey</th>
          <td mat-cell *matCellDef="let element"> {{element.dateOfDelivery}} </td>
        </ng-container>
      
        <!-- Name Column -->
        <ng-container matColumnDef="customerName">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element"> {{element.customerName}} </td>
        </ng-container>
      
        <!-- Email Column -->
        <ng-container matColumnDef="customerEmail">
          <th mat-header-cell *matHeaderCellDef> Email </th>
          <td mat-cell *matCellDef="let element"> {{element.customerEmail}} </td>
        </ng-container>
      
        <!-- Phone Column -->
        <ng-container matColumnDef="customerPhone">
          <th mat-header-cell *matHeaderCellDef> Phone </th>
          <td mat-cell *matCellDef="let element"> {{element.customerPhone}} </td>
        </ng-container>
      
        <!-- Item Id Column -->
        <ng-container matColumnDef="itemName">
            <th mat-header-cell *matHeaderCellDef> Item Name </th>
            <td mat-cell *matCellDef="let element"> {{element.itemName}} </td>
          </ng-container>

          <!-- Street column -->
          <ng-container matColumnDef="street">
            <th mat-header-cell *matHeaderCellDef> street </th>
            <td mat-cell *matCellDef="let element"> {{element.street}} </td>
          </ng-container>

          <!-- City Column -->
          <ng-container matColumnDef="city">
            <th mat-header-cell *matHeaderCellDef> city </th>
            <td mat-cell *matCellDef="let element"> {{element.city}} </td>
          </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <div id="logout">
        <button mat-mini-fab color="primary" routerLink="/login" (click)="refresh()">
            <mat-icon>logout</mat-icon>
          </button>
        </div>
